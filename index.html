<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสอบถาม</title>
</head>
<body>

<h2 style="text-align: center;">แบบสอบถาม</h2>

<form>
    <table align="center" width="400" cellpadding="5" style="background-color:#f5e3c3;">
        <tr>
            <td colspan="2">
            <b>ข้อมูลผู้ตอบแบบสอบถาม</b>
             <hr>
            </td>
        </tr>
        <tr>
            <td colspan="2">
            <b>ชื่อ - นามสกุล</b>
            <input tag type="text" style="width:78%;">
            </td>
        </tr>
        <tr>
        <td colspan="2">
        <b>รหัสนักศึกษา</b>
        <input tag type="text" style="width:78%;">
            </td>
        </tr>
        <tr>
        <td colspan="2">
        <b>เพศ</b>
        <input tag type="radio" name="gender"> ชาย
        <input tag type="radio" name="gender"> หญิง
            </td>
        </tr>
        <tr>
            <td style="vertical-align: middle; width: 30%;">
            <b>สังกัดคณะ</b>
            </td>
            <td>
            <select tag size="10" style="width:54%; height:120px;">
            <option>วิทยาศาสตร์</option>
            <option>วิทยาการคอมพิวเตอร์</option>
            <option>ครุศาสตร์</option>
            <option>บริหารธุรกิจและการจัดการ</option>
            <option>มนุษยศาสตร์</option>
            <option>เทคโนโลยีอุตสาหกรรม</option>
            <option>เกษตรศาสตร์</option>
            <option>พยาบาลศาสตร์</option>
            <option>สาธารณสุขศาสตร์</option>
            <option>แพทย์แผนไทยและทางเลือก</option>
            <option>นิติศาสตร์</option>
            </select>
            </td>
        </tr>
        <tr>
        <td colspan="2"><b>แม่สีที่ชื่นชอบ</b></td>
        </tr>
        <tr>
        <td colspan="2">
        <input tag type="checkbox"> สีแดง
        <input tag type="checkbox"> สีเขียว
        <input tag type="checkbox"> สีน้ำเงิน
        </td>
        </tr>
        <tr>
        <td colspan="2"><b>ผลไม้ที่ชื่นชอบ</b></td>
        </tr>
        <tr>
        <td colspan="2">
        <input tag type="checkbox"> มะม่วง
        <input tag type="checkbox"> น้อยหน่า
        <input tag type="checkbox"> ทุเรียน
        <input tag type="checkbox"> กล้วย
        <input tag type="checkbox"> ฝรั่ง
        <input tag type="checkbox"> แตงโม
        </td>
        </tr>
        <tr>
        <td colspan="2"><b>อาหารที่ชื่นชอบ</b></td>
        </tr>
        <tr>
        <td colspan="2">
        <input tag type="checkbox"> ต้มยำกุ้ง
        <input tag type="checkbox"> ไข่เจียวหมูสับ
        <input tag type="checkbox"> แกงขาไก่
        <input tag type="checkbox"> แกงเขียวหวานไก่<br>
        <input tag type="checkbox"> ผัดไทย
        <input tag type="checkbox"> ราดหน้าหมูกรอบ
        </td>
        </tr>
        <tr>
        <td colspan="2" style="text-align:center;">
        <input tag type="submit" value="บันทึก">
        </td>
        </tr>
    </table>
       </form>
           </body>
                </html>
